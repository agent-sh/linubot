<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pair with Linubot</title><link rel="icon" href="/assets/icon.png"><link rel="stylesheet" href="/phone.css"><script type="module" src="/phone-pair.js"></script></head><body><main><img src="/assets/icon.png" alt="" width="72" height="72"><h1>Your bots, with you.</h1><p>Pair this phone with your Linux computer. Open Settings → Phone access in Linubot to create a code.</p><form><label>Phone name<input name="name" autocomplete="off" maxlength="80" value="My phone" required></label><label>Pairing code<input name="code" autocomplete="one-time-code" autocapitalize="characters" maxlength="12" required></label><button>Connect to my bots</button><p role="status" id="status"></p></form><p class="hint">This device can use your bots, approve tasks and control their computers. Keep Linubot and Tailscale running on Linux.</p></main></body></html>
