plugins { id 'com.android.application' }
android {
    namespace 'sh.agent.linubot'
    compileSdk 37
    defaultConfig { applicationId 'sh.agent.linubot'; minSdk 26; targetSdk 35; versionCode 21200; versionName '2.12.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.19.0'; implementation 'com.journeyapps:zxing-android-embedded:4.3.0'; testImplementation 'junit:junit:4.13.2' }
